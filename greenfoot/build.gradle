apply plugin: 'java-library'
apply plugin: 'org.openjfx.javafxplugin'
apply plugin: 'application'

dependencies {
    annotationProcessor project(':anns-threadchecker')
    compileOnly project(':anns-threadchecker')
    annotationProcessor project(':threadchecker')
    compileOnly project(':threadchecker')
    implementation project(':bluej')
    implementation project(':boot')

    implementation 'au.com.bytecode:opencsv:2.4'
    implementation 'org.apache.httpcomponents:httpclient:4.5.13'
    implementation 'org.apache.httpcomponents:httpmime:4.1.1'
    implementation 'commons-logging:commons-logging:1.2'
    implementation 'javazoom:jlayer:1.0.1'
    implementation 'org.glavo:simple-png:0.2.0'
    implementation 'org.glavo:simple-png-javafx:0.2.0'
    // SuperGreenfoot IDE theme (MIT). Not transitive: its POM pulls a newer
    // JavaFX than the one this build uses.
    implementation('io.github.mkpaz:atlantafx-base:2.1.0') { transitive = false }

    testCompileOnly project(':anns-threadchecker')
    testImplementation 'org.junit.jupiter:junit-jupiter:5.5.2'
    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.5.2'
    testImplementation 'org.junit.jupiter:junit-jupiter-engine:5.5.2'
    testImplementation 'org.junit.platform:junit-platform-launcher:1.5.2'
    testImplementation 'org.junit.vintage:junit-vintage-engine:5.5.2'
}

repositories {
    mavenCentral()
}

javafx {
    version = "21.0.12"  // javafx_version_setting <-- The Github Actions on Linux uses this to find and replace this line
    modules = ['javafx.base', 'javafx.controls', 'javafx.graphics', 'javafx.swing', 'javafx.web']
}

test {
    useJUnit()
    // SuperGreenfoot: ImportableTemplatesTest compiles these itself, so a change to
    // them must rerun the tests:
    inputs.dir 'common'
    inputs.dir 'src/test/templates'
}

compileJava {
    options.compilerArgs += ["-Xplugin:threadchecker.TCPlugin"]
}
tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
    options.release = 21
}

task copyLibToBuild(type: Copy) {
    from '../bluej/lib'
    from 'lib'
    from 'labels'
    into new File(sourceSets.main.output.resourcesDir, 'lib')
}

task copyImagelibToBuild(type: Copy) {
    from 'imagelib'
    into new File(sourceSets.main.output.resourcesDir, 'lib/greenfoot/imagelib')
}
// The classes offered by Edit > Import Class (the installers copy them too).
// Sync, not Copy: a plain Copy never deletes a destination file whose source
// was removed or moved (e.g. by the Import Class category reorg), which left
// stale duplicate/ghost templates in the build output.
task copyCommonToBuild(type: Sync) {
    from 'common'
    into new File(sourceSets.main.output.resourcesDir, 'lib/greenfoot/common')
}
task copyGreenfootIcon1(type: Copy) {
    from file('resources/images/greenfoot-icon-16.png')
    into new File(sourceSets.main.output.resourcesDir, 'lib/greenfoot/imagelib/other')
    rename { 'greenfoot.png' }
}
task copyGreenfootIcon2(type: Copy) {
    from file('resources/images/greenfoot-icon-16.png')
    into new File(sourceSets.main.output.resourcesDir, 'images')
    rename { 'greenfoot.png' }
}

assemble.dependsOn copyLibToBuild
assemble.dependsOn copyImagelibToBuild
assemble.dependsOn copyCommonToBuild
assemble.dependsOn copyGreenfootIcon1
assemble.dependsOn copyGreenfootIcon2
jar.dependsOn copyLibToBuild
jar.dependsOn copyImagelibToBuild
jar.dependsOn copyCommonToBuild
jar.dependsOn copyGreenfootIcon1
jar.dependsOn copyGreenfootIcon2
compileTestJava.dependsOn copyLibToBuild
compileTestJava.dependsOn copyImagelibToBuild
compileTestJava.dependsOn copyCommonToBuild
compileTestJava.dependsOn copyGreenfootIcon1
compileTestJava.dependsOn copyGreenfootIcon2

task copyToLib(type: Copy) {
    // SuperGreenfoot: Boot loads every javafx-*.jar in lib, so jars left over from
    // an earlier JavaFX version would load beside the current ones.
    doFirst {
        delete fileTree(new File(sourceSets.main.output.resourcesDir, 'lib')) { include 'javafx-*.jar' }
    }
    into new File(sourceSets.main.output.resourcesDir, 'lib')
    from configurations.runtimeClasspath
    from 'lib'
    from 'labels'
    from '../bluej/build/libs/bluej.jar'
} 
copyToLib.dependsOn ':bluej:blueJCoreJar'
copyToLib.dependsOn jar

task greenfootJar(type: Jar) {
    archiveFileName = "greenfoot.jar"
    from "build/classes/java/main"
    from('resources/images') {
        include "readme.png",
                // Empty image - just to force same layout of compile and readme button
                "compile.png",
                // Image used when dragging object over an area where it can not be dropped
                "noParking.png",
                // Image selection dialog icon
                "openRight.png",
                // Control panel icons
                "run.png", "step.png", "pause.png", "reset.png",
                // Export icons
                "export-app.png", "export-project.png", "export-publish.png", "export-publish-small.png", "export-webpage.png",
                // Menu button used in image library dialog (gear with drop-arrow)
                "menu-button.png",
                // Execution/activity twirler
                "swirl.png",
                "dropdown.png"
    }
    destinationDirectory = new File(sourceSets.main.output.resourcesDir, 'lib')
}
greenfootJar.dependsOn compileJava

// SuperGreenfoot: the standalone runtime bundled into exported application jars.
// Engine + Swing player + BlueJ support classes + MP3 decoder; no JavaFX. IDE-only
// packages are excluded so the jar stays small and cannot drag JavaFX in.
task superGreenfootRuntimeJar(type: Jar) {
    archiveFileName = "supergreenfoot-runtime.jar"
    destinationDirectory = new File(sourceSets.main.output.resourcesDir, 'lib')
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from("build/classes/java/main") {
        exclude "greenfoot/guifx/**", "greenfoot/vmcomm/**", "greenfoot/export/mygame/**",
                "greenfoot/importer/**", "greenfoot/record/**", "greenfoot/localdebugger/**",
                "greenfoot/core/ProjectManager*", "greenfoot/core/GreenfootMain*",
                "greenfoot/core/GreenfootLauncherDebugVM*", "greenfoot/platforms/ide/**",
                "greenfoot/sound/SoundPreferencePanel*", "greenfoot/sound/SoundRecorder*",
                "greenfoot/sound/MicLevelGrabber*"
    }
    from('resources/images') {
        include "greenfoot-icon-32.png"
        rename { 'greenfoot.png' }
    }
    from(zipTree('../bluej/build/libs/bluej.jar')) {
        exclude "META-INF/**"
    }
    from(configurations.runtimeClasspath.filter { it.name.startsWith('jlayer') }.collect { zipTree(it) }) {
        exclude "META-INF/**"
    }
    manifest {
        attributes 'Main-Class': 'greenfoot.player.PlayerMain',
                   'SuperGreenfoot-Runtime': greenfootVersion
    }
}
superGreenfootRuntimeJar.dependsOn compileJava
superGreenfootRuntimeJar.dependsOn ':bluej:jar'
jar.dependsOn superGreenfootRuntimeJar
assemble.dependsOn superGreenfootRuntimeJar
assemble.dependsOn greenfootJar
assemble.dependsOn copyToLib
jar.dependsOn greenfootJar
compileTestJava.dependsOn copyToLib

task runGreenfoot(type: JavaExec) {
    group = 'application'
    classpath = files('build/resources/main/lib/boot.jar') + sourceSets.main.runtimeClasspath + files('build/resources/main/lib/greenfoot.jar')
    main = "bluej.Boot"
    args "-bluej.debug=true", "-greenfoot=true"
    // SuperGreenfoot: without these a run from source shows in the Dock as a generic "java"
    if (System.getProperty('os.name').contains('Mac')) {
        jvmArgs "-Xdock:name=SuperGreenfoot", "-Xdock:icon=" + file('resources/images/greenfoot.icns').absolutePath
    }
}
runGreenfoot.dependsOn build

// SuperGreenfoot, dev only: open the new IDE window shell with sample data (no
// project, no debug VM). Pass options with -PpreviewArgs="dark collapsed ...".
task runSuperIdePreview(type: JavaExec) {
    group = 'application'
    description = 'Dev only: show the SuperGreenfoot IDE window shell with sample data.'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'greenfoot.guifx.superide.SuperStagePreview'
    args new File(sourceSets.main.output.resourcesDir, 'lib').absolutePath
    if (project.hasProperty('previewArgs')) {
        args project.property('previewArgs').toString().tokenize()
    }
}
runSuperIdePreview.dependsOn copyLibToBuild, testClasses

task renderTemplateThumbnails(type: JavaExec) {
    group = 'application'
    description = 'Dev only: redraw the Import Class thumbnails of the templates that draw themselves, from the real classes.'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'greenfoot.templates.RenderTemplateThumbnails'
    workingDir = projectDir
    systemProperty 'java.awt.headless', 'true'
}
renderTemplateThumbnails.dependsOn testClasses


group = 'org.bluej'
description = 'greenfoot'

task userJavadoc(type: Javadoc) {
    doFirst {
        mkdir("../bluej/doc/API")
    }
    source = sourceSets.main.allJava
    includes = ['greenfoot/Actor.java',
                'greenfoot/Color.java',
                'greenfoot/Font.java',
                'greenfoot/Greenfoot.java',
                'greenfoot/GreenfootImage.java',
                'greenfoot/GreenfootSound.java',
                'greenfoot/MouseInfo.java',
                'greenfoot/ScaleMode.java',
                'greenfoot/SuperWindow.java',
                'greenfoot/Network.java',
                'greenfoot/NetServer.java',
                'greenfoot/NetClient.java',
                'greenfoot/NetEvent.java',
                'greenfoot/UserInfo.java',
                'greenfoot/World.java']
    destinationDir = file("../bluej/doc/API")
    classpath = sourceSets.main.output.classesDirs + project.configurations.compileClasspath
}
userJavadoc.dependsOn assemble

// SuperGreenfoot: running from source reads the API documentation (double-click
// World or Actor, Help > Greenfoot Class Documentation) from lib/doc/API, as the
// installed app does. Without this copy those pages were blank.
task copyApiDocToBuild(type: Copy) {
    from '../bluej/doc/API'
    into new File(sourceSets.main.output.resourcesDir, 'lib/doc/API')
}
copyApiDocToBuild.dependsOn userJavadoc
runGreenfoot.dependsOn copyApiDocToBuild
// The tests read the build's lib folder, so Gradle needs them ordered after the copy:
test.mustRunAfter copyApiDocToBuild
compileTestJava.mustRunAfter copyApiDocToBuild

task packageGreenfootMacIntel(type: Exec) {
    workingDir "../bluej/package"
    environment JAVA_HOME: System.getProperty('java.home')
    commandLine toolProps["ant_exe"], "-buildfile", "greenfoot-build.xml", "mac-dist",
            "-Dbuild_java_home=" + System.getProperty('java.home'),
            "-Dmac_bundled_jdk_path=" + System.getProperty('java.home'),
            "-Dgreenfoot.version=" + greenfootVersion,
            "-Dgreenfoot.rcsuffix=" + greenfootRCSuffix,
            "-Dbluej_home=" + rootDir.getAbsoluteFile() + "/bluej/",
            "-Dgreenfoot_home=" + projectDir.getAbsoluteFile(),
            "-Dmac_arch=x86_64",
            "-Dmac_bundler_arch_dir=x64"
}
task packageGreenfootMacAarch(type: Exec) {
    workingDir "../bluej/package"
    environment JAVA_HOME: System.getProperty('java.home')
    commandLine toolProps["ant_exe"], "-buildfile", "greenfoot-build.xml", "mac-dist",
            "-Dbuild_java_home=" + System.getProperty('java.home'),
            "-Dmac_bundled_jdk_path=" + System.getProperty('java.home'),
            "-Dgreenfoot.version=" + greenfootVersion,
            "-Dgreenfoot.rcsuffix=" + greenfootRCSuffix,
            "-Dbluej_home=" + rootDir.getAbsoluteFile() + "/bluej/",
            "-Dgreenfoot_home=" + projectDir.getAbsoluteFile(),
            "-Dmac_arch=arm64",
            "-Dmac_bundler_arch_dir=aarch64"
}
packageGreenfootMacIntel.dependsOn assemble, userJavadoc

// SuperGreenfoot macOS installer: ./gradlew :greenfoot:packageSuperGreenfootMac [-PsignName="Name (TEAM)" -PnotarizeProfile=SuperGreenfoot]
task packageSuperGreenfootMac(type: Exec) {
    group = 'distribution'
    description = 'Build SuperGreenfoot.app and a DMG with jpackage (signed/notarized when -PsignName/-PnotarizeProfile are given).'
    workingDir rootDir
    environment JAVA_HOME: System.getProperty('java.home')
    def args = ['installer/mac/build-dmg.sh', '--no-build']
    if (project.hasProperty('signName')) { args += ['--sign', project.property('signName')] }
    if (project.hasProperty('notarizeProfile')) { args += ['--notarize', project.property('notarizeProfile')] }
    commandLine args
}
packageSuperGreenfootMac.dependsOn assemble, userJavadoc
packageGreenfootMacAarch.dependsOn assemble, userJavadoc

task packageGreenfootWindows(type: Exec) {
    workingDir "../bluej/package"
    commandLine toolProps["ant_exe"], "-buildfile", "greenfoot-build.xml", "windows-msi-bundled-dist", "windows-standalone",
            "-Dbuild_java_home=" + System.getProperty('java.home'),
            "-Dwin_bundled_jdk_path=" + System.getProperty('java.home'),
            "-Dgreenfoot.version=" + greenfootVersion,
            "-Dgreenfoot.rcsuffix=" + greenfootRCSuffix,
            "-Dbluej_home=" + rootDir.getAbsoluteFile() + "/bluej/",
            "-Dgreenfoot_home=" + projectDir.getAbsoluteFile(),
            "-Dmingw_root=" + toolProps["mingw_root"],
            "-Dwix_bin=" + toolProps["wix_bin"]
}
packageGreenfootWindows.dependsOn assemble, userJavadoc

task packageGreenfootLinux(type: Exec) {
    workingDir "../bluej/package"
    commandLine "fakeroot", toolProps["ant_exe"], "-buildfile", "greenfoot-build.xml", "dist", "debian-bundled-dist",
            "-Dbuild_java_home=" + System.getProperty('java.home'),
            "-Ddeb_bundled_jdk_path=" + System.getProperty('java.home'),
            "-Dgreenfoot.version=" + greenfootVersion,
            "-Dgreenfoot.rcsuffix=" + greenfootRCSuffix,
            "-Dbluej_home=" + rootDir.getAbsoluteFile() + "/bluej/",
            "-Dgreenfoot_home=" + projectDir.getAbsoluteFile()
}
packageGreenfootLinux.dependsOn assemble, userJavadoc

distTar.enabled = false
distZip.enabled = false

task urlsRC(type: Exec) {
    workingDir "../bluej/package"
    commandLine toolProps["ant_exe"], "-S",  "-buildfile", "greenfoot-build.xml", "urls-rc",
            "-Dbuild_java_home=" + System.getProperty('java.home'),
            "-Dgreenfoot.version=" + greenfootVersion,
            "-Dgreenfoot.rcsuffix=" + greenfootRCSuffix
}
