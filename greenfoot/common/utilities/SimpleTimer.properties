display.name=Simple Timer
category=Utilities
description.short=A stopwatch for timing things in milliseconds (not an actor).
description.long=A small helper class, not an actor, for measuring real \
  elapsed time. Call mark() to start timing, then millisElapsed() at any \
  point afterwards to find out how many milliseconds have passed. Create \
  one as a field in your own class rather than adding it to the world.
