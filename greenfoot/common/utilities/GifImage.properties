display.name=Gif Image
category=Utilities
description.short=Loads an animated GIF as a set of frames to cycle through (not an actor).
description.long=A helper class, not an actor, that loads an animated GIF \
  file and splits it into an array of GreenfootImages, one per frame, so \
  your own actor can cycle through them to animate itself. Create one as a \
  field in your own class rather than adding it to the world.
