display.name=Stat Bar
category=Score & Stats
description.short=A health, energy or progress bar that can follow an actor.
description.long=Shows a value out of a maximum as a coloured bar, e.g. \
  new StatBar(100, player) makes a full health bar that floats above the \
  player. Call setValue to change it and the bar slides to the new value. \
  It can hide itself when full, have a border, and show several bars at \
  once, such as health and mana.
