display.name=Counter
category=Score & Stats
description.short=An animated score counter that counts up or down.
description.long=Displays a number that animates smoothly toward a target \
  value whenever add() is called, instead of jumping straight to it. Good \
  for a running score. Use setPrefix to show text before the number, like \
  "Score: ". It draws its own gold box; the longer constructor or \
  setColors changes its size and colours.
