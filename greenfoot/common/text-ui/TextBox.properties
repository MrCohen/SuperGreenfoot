display.name=Text Box
category=Text & UI
description.short=A box of text: a title, a message, or a scrolling log.
description.long=Shows one or more lines of text in a box that sizes itself to \
  fit, e.g. new TextBox("Game Over", 48). Change the text any time with \
  setText. Give it a fixed number of lines and addLine makes it a scrolling \
  log. Colours, border, font, centring and size can all be changed; pass \
  null to setColors for no background or no border.
