display.name=Score Board
category=Online (UserInfo)
description.short=A leaderboard showing the top players and players near you.
description.long=Draws a two-panel leaderboard using Greenfoot's UserInfo \
  class: the top scores overall on the left, and the scores of players \
  ranked near you on the right. Add one to the world when your game ends, \
  e.g. addObject(new ScoreBoard(800, 600), getWidth() / 2, getHeight() / 2).
