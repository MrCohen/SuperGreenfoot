name: Something is not working
description: Report a bug or anything that behaved differently from what you expected.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time. Short answers are fine, and you do not need to be a programmer to report something.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Your computer
      options:
        - Mac with Apple Silicon (installer)
        - Mac (running from source)
        - Windows (running from source)
        - Linux (running from source)
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Super Greenfoot version
      description: Shown in the About box, for example 0.1.0.
  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: >
        Screenshots, a small scenario that shows the problem, or the debug log
        (on a Mac it is ~/Library/Preferences/org.supergreenfoot/greenfoot-debuglog.txt).
